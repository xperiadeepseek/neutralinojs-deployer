name: Dynamic Website Packager

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Application Name (e.g., ChatGPT, YouTube)'
        required: true
        default: 'MyWebApp'
        type: string
      website_url:
        description: 'Website URL (e.g., https://chatgpt.com)'
        required: true
        type: string

jobs:
  build-wrapper:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Neutralino CLI
        run: npm install -g @neutralinojs/neu

      - name: Initialize Project
        run: neu create wrapper_app

      - name: Configure App for Remote URL
        run: |
          cd wrapper_app
          
          # Use jq to safely update only the necessary fields, keeping the "cli" block intact
          jq '.url = "${{ inputs.website_url }}" | 
              .enableServer = false | 
              .window.title = "${{ inputs.app_name }}" | 
              .window.width = 1200 | 
              .window.height = 800 |
              .window.minWidth = 400 |
              .window.minHeight = 300' neutralino.config.json > tmp.json
          
          mv tmp.json neutralino.config.json

      - name: Update Core Binaries
        run: |
          cd wrapper_app
          neu update

      - name: Build Executable
        run: |
          cd wrapper_app
          neu build

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app_name }}-Windows
          path: wrapper_app/dist/**/*-win_x64.exe
