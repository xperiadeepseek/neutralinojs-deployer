name: Dynamic Website Packager

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Application Name (e.g., ChatGPT, YouTube)'
        required: true
        default: 'MyWebApp'
        type: string
      website_url:
        description: 'Website URL (e.g., https://chatgpt.com)'
        required: true
        type: string

jobs:
  build-wrapper:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Neutralino CLI
        run: npm install -g @neutralinojs/neu

      - name: Initialize Project
        run: neu create wrapper_app

      - name: Configure App for Remote URL
        run: |
          cd wrapper_app
          cat <<EOF > neutralino.config.json
          {
            "applicationId": "com.dynamic.wrapper",
            "version": "1.0.0",
            "defaultMode": "window",
            "url": "${{ inputs.website_url }}",
            "enableServer": false,
            "window": {
              "title": "${{ inputs.app_name }}",
              "width": 1200,
              "height": 800,
              "minWidth": 400,
              "minHeight": 300
            }
          }
          EOF

      - name: Update Core Binaries
        run: |
          cd wrapper_app
          neu update

      - name: Build Executable
        run: |
          cd wrapper_app
          neu build

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app_name }}-Windows
          path: wrapper_app/dist/**/*-win_x64.exe
