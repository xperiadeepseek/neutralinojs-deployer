name: Dynamic Website Packager

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Application Name (e.g., ChatGPT, YouTube)'
        required: true
        default: 'MyWebApp'
        type: string
      website_url:
        description: 'Website URL (e.g., https://chatgpt.com)'
        required: true
        type: string

jobs:
  build-wrapper:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Neutralino CLI
        run: npm install -g @neutralinojs/neu

      - name: Initialize Project
        run: neu create wrapper_app

      - name: Configure App for Remote URL
        run: |
          cd wrapper_app
          
          # 1. Ensure the URL has https://
          URL="${{ inputs.website_url }}"
          if [[ ! "$URL" =~ ^https?:// ]]; then
            URL="https://$URL"
          fi
          
          # 2. Update config using the correct .modes.window JSON path
          jq --arg url "$URL" \
             --arg title "${{ inputs.app_name }}" \
             '.url = $url | 
              .enableServer = false | 
              .modes.window.title = $title | 
              .modes.window.width = 1200 | 
              .modes.window.height = 800 |
              .modes.window.minWidth = 400 |
              .modes.window.minHeight = 300' neutralino.config.json > tmp.json
          
          mv tmp.json neutralino.config.json

      - name: Update Core Binaries
        run: |
          cd wrapper_app
          neu update

      - name: Build Executable
        run: |
          cd wrapper_app
          neu build

      - name: Rename Final Executable
        run: |
          cd wrapper_app/dist/wrapper_app
          mv wrapper_app-win_x64.exe "${{ inputs.app_name }}.exe"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app_name }}-Windows
          path: wrapper_app/dist/wrapper_app/${{ inputs.app_name }}.exe
